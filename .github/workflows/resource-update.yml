
name: Survivors Network Resource Maintenance

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survivors-resource-maintenance
  cancel-in-progress: false

jobs:
  update-public-resources:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify required project files
        run: |
          set -e

          required_files=(
            "resource_update.py"
            "resource_crawler.py"
            "directory_updates.py"
            "state_resource_directory.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          echo "All required resource-maintenance files found."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            resource_update.py \
            resource_crawler.py \
            directory_updates.py

      - name: Run resource maintenance
        run: |
          python resource_update.py

      - name: Verify maintenance output
        run: |
          set -e

          if [ ! -d "resource_crawler_data" ]; then
            echo "::error::The maintenance script did not create resource_crawler_data."
            exit 1
          fi

          echo "Resource maintenance output:"
          find resource_crawler_data -maxdepth 1 -type f -print

      - name: Commit public directory maintenance data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The canonical state directory is in the repository root.
          git add -A -- state_resource_directory.json

          # Stage crawler and directory-maintenance runtime data.
          if [ -d "resource_crawler_data" ]; then
            git add -A -- resource_crawler_data/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Automated public resource directory maintenance"

            # Explicitly push to the branch that triggered this workflow.
            git push origin "HEAD:${GITHUB_REF}"
          else
            echo "No public resource directory changes to commit."
          fi
